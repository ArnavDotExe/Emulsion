name: android

on:
  push:
    paths: ["android/**", "tools/colorlab/src/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "tools/colorlab/src/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/colorlab/pyproject.toml
      - name: Conformance fixtures are up to date with colorlab
        run: |
          python -m pip install -e tools/colorlab
          python android/look/src/test/fixtures/make_conformance.py
          git diff --exit-code -- android/look/src/test/resources/conformance
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: android
        run: ./gradlew :look:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
