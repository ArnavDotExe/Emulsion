name: colorlab

on:
  push:
    paths: ["tools/colorlab/**", ".github/workflows/colorlab.yml"]
  pull_request:
    paths: ["tools/colorlab/**", ".github/workflows/colorlab.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: tools/colorlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/colorlab/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test (public suite, coverage >= 80%)
        run: python -m pytest --cov --cov-report=term-missing --ignore=tests/private
