[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colorlab"
version = "0.1.0"
description = "FilmSim color lab: Lightroom preset decoding, LUT tooling and the reference film pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.26",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "colour-science>=0.4.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "private: needs the gitignored presets in presets/private (skipped when absent)",
]

[tool.coverage.run]
source = ["colorlab"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
